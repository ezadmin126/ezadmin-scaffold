<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{account/fragments :: head('修改密码', false)}"></head>
<body>
<main class="account-card">
    <h1>修改密码</h1>
    <div th:replace="~{account/fragments :: messages}"></div>
    <form method="post" th:action="@{/login/resetPassword.html}">
        <label class="field">当前密码 <input type="password" name="currentPassword" autocomplete="current-password" required></label>
        <label class="field">新密码 <input type="password" name="newPassword" minlength="8" autocomplete="new-password" required></label>
        <button type="submit">保存并重新登录</button>
        <a th:href="@{/}">取消</a>
    </form>
</main>
</body>
</html>
