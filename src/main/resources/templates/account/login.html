<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{account/fragments :: head('登录', false)}"></head>
<body>
<main class="account-card">
    <h1>登录管理系统</h1>
    <p class="error" th:if="${param.error}" role="alert">用户名或密码错误，或账号已停用。</p>
    <p class="notice" th:if="${param.logout}" role="status">已退出登录。</p>
    <p class="notice" th:if="${param.changed}" role="status">密码已修改，请重新登录。</p>
    <form method="post" th:action="@{/login}">
        <label class="field">用户名 <input name="username"   autocomplete="username" required></label>
        <label class="field">密码 <input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit">登录</button>
    </form>
</main>
<script>
    try {
        Object.keys(sessionStorage).filter(key => key.startsWith('ez-layout:menu:'))
            .forEach(key => sessionStorage.removeItem(key));
    } catch (error) {}
</script>
</body>
</html>
